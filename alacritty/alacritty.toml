[general]
import = [
    "~/.config/alacritty/theme.toml"
]

# Automatically reload configuration when changes are saved
live_config_reload = true

[window]
# Default window dimensions (columns and lines)
dimensions = { columns = 100, lines = 30 }

# Blank space added around the terminal text
padding = { x = 8, y = 8 }

# Turn off dynamic padding to strictly enforce the padding sizes above
dynamic_padding = false

# Window decorations: "full", "none", "transparent", or "buttonless"
decorations = "full"

# Window opacity (0.0 is completely transparent, 1.0 is opaque)
opacity = 0.95

[scrolling]
# Maximum number of lines kept in the scrollback history
history = 10000

# Number of lines scrolled by the mouse wheel
multiplier = 3

[font]
# Font size in points
size = 12.0

# Define the font family (replace with your installed Nerd Font for best results)
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
# Cursor style: "Block", "Underline", or "Beam"
style = "Beam"

[terminal.shell]
program = "fish"
args = ["--login"]

